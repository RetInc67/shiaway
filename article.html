<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080909">
<title>Статья — ShiaWay</title><link rel="stylesheet" href="style.css">
</head>
<body class="reader-page">
<header class="reader-header">
  <a class="brand" href="index.html#articles"><span class="brand-mark"><img src="assets/shiaway-avatar.jpg" alt="ShiaWay"></span><span>SHIA<span>WAY</span></span></a>
  <div class="reader-header-actions"><button class="reader-theme-toggle" id="readerThemeToggle" type="button" aria-label="Переключить тему"><span class="theme-sun">☀</span><span class="theme-moon">☾</span></button><a class="reader-home" href="index.html#articles">← Все статьи</a></div>
</header>

<form class="reader-search-top" id="readerSearchTop">
  <input type="text" id="readerSearchInput" placeholder="Введите слово для поиска..." autocomplete="off">
  <button type="submit"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Поиск</button>
</form>

<main class="reader-shell">
  <div class="reader-breadcrumbs" id="readerCrumbs"><a class="crumb-home" href="index.html#articles" title="Главная"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a><a href="index.html#articles">Статьи</a></div>
  <header class="reader-title-block">
    <div class="reader-kicker" id="readerKicker">SHIAWAY • СТАТЬЯ</div>
    <h1 id="readerTitle">Загрузка…</h1>
    <div class="reader-byline" id="readerMeta"></div>
  </header>
  <div class="reader-layout">
    <article class="reader-content" id="readerContent"><div class="reader-loading">Загружаем материал…</div></article>

    <aside class="site-sidebar">
      <div class="reader-toc-block" id="readerTocBlock" hidden>
        <div class="sidebar-block"><h3>В этой статье</h3><nav id="readerToc" class="sidebar-list"></nav></div>
      </div>
      <div class="sidebar-block">
        <h3>Рубрики</h3>
        <select class="sidebar-select" id="sidebarRubrics"><option value="">Выберите рубрику</option></select>
      </div>

      <div class="sidebar-block">
        <h3>Последние записи</h3>
        <ul class="sidebar-list" id="sidebarRecent"></ul>
      </div>

      <div class="sidebar-block">
        <h3>Популярные статьи</h3>
        <ul class="sidebar-list" id="sidebarPopular"></ul>
      </div>
    </aside>
  </div>

  <div class="reader-share-circles" id="readerShare" hidden>
    <span class="reader-share-label">Поделиться:</span>
    <button class="share-circle native-share" id="shareNative" type="button" title="Поделиться" aria-label="Поделиться"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.6 6.6-3.9M8.7 13.4l6.6 3.9"/></svg><span class="share-native-text">Поделиться</span></button>
    <a class="share-circle tg" id="shareTelegram" target="_blank" rel="noopener noreferrer" title="Telegram" aria-label="Поделиться в Telegram"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M21.8 3.1 18.6 20c-.24 1.2-.88 1.5-1.79.93l-5.12-3.78-2.47 2.38c-.27.27-.5.5-1.02.5l.36-5.2 9.47-8.56c.41-.36-.09-.56-.64-.2L5.69 13.65.64 12.07c-1.1-.35-1.12-1.1.23-1.62L20.6 2.76c.92-.34 1.72.21 1.2.34Z"/></svg></a>
    <a class="share-circle wa" id="shareWhatsapp" target="_blank" rel="noopener noreferrer" title="WhatsApp" aria-label="Поделиться в WhatsApp"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A11.9 11.9 0 0 0 12.02 0C5.42 0 .06 5.36.06 11.96c0 2.11.55 4.17 1.6 5.98L0 24l6.2-1.62a11.9 11.9 0 0 0 5.82 1.48h.01c6.6 0 11.96-5.36 11.96-11.96a11.9 11.9 0 0 0-3.49-8.4ZM12.03 21.82a9.84 9.84 0 0 1-5.02-1.38l-.36-.22-3.68.96.98-3.59-.24-.37a9.84 9.84 0 1 1 8.32 4.6Zm5.4-7.37c-.3-.15-1.78-.88-2.05-.98-.28-.1-.48-.15-.68.15-.2.3-.78.98-.95 1.18-.17.2-.35.22-.65.07-.3-.15-1.24-.46-2.36-1.47-.87-.78-1.46-1.74-1.63-2.03-.17-.3-.02-.46.13-.61.14-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.68-1.64-.93-2.25-.25-.6-.5-.52-.68-.53h-.58c-.2 0-.52.07-.8.37-.27.3-1.03 1.01-1.03 2.47s1.06 2.87 1.21 3.07c.15.2 2.08 3.18 5.04 4.46.7.3 1.25.48 1.68.61.7.22 1.34.19 1.84.12.56-.08 1.78-.73 2.03-1.43.25-.7.25-1.3.17-1.43-.07-.13-.27-.2-.57-.35Z"/></svg></a>
    <a class="share-circle vk" id="shareVk" target="_blank" rel="noopener noreferrer" title="VK" aria-label="Поделиться во ВКонтакте"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M3.4 7.1c.15-.46.56-.8 1.05-.8h2.1c.43 0 .82.25 1 .64.8 1.77 1.74 3.38 2.73 4.73.3.4.53.48.7.48.18 0 .29-.12.29-.54V7.22c0-.48-.13-.65-.58-.76-.22-.05-.18-.2.08-.38.45-.31 1.24-.5 2.2-.5h1.08c.3 0 .54.24.54.54v5.02c0 .22.1.3.25.3.17 0 .32-.08.63-.39 1.16-1.29 2.1-3.08 2.73-4.72.14-.36.48-.6.87-.6h2.1c.56 0 .94.55.72 1.06-.36.83-.83 1.7-1.39 2.59-.46.72-.97 1.42-1.5 2.04-.2.24-.19.43.02.67 1.1 1.22 2.1 2.6 2.82 3.8.3.5-.06 1.14-.64 1.14h-2.2c-.4 0-.78-.2-1-.54-.52-.8-1.17-1.72-1.92-2.5-.3-.3-.54-.42-.78-.42-.27 0-.39.14-.39.52v2.34c0 .33-.27.6-.6.6h-1.1c-3.56 0-6.47-2.72-8.76-7.2-.83-1.62-1.42-2.9-1.78-4.08Z"/></svg></a>
    <a class="share-circle tw" id="shareTw" target="_blank" rel="noopener noreferrer" title="X" aria-label="Поделиться в X"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M18.9 2H22l-6.77 7.74L23.2 22h-6.4l-5.02-6.56L6.05 22H2.95l7.25-8.28L.8 2H7.36l4.54 5.99L18.9 2Zm-1.13 17.4h1.72L6.3 4.47H4.45L17.77 19.4Z"/></svg></a>
    <button class="share-circle copy" id="shareCopy" type="button" title="Скопировать ссылку" aria-label="Скопировать ссылку"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M15 9V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/></svg></button>
  </div>

  <div class="reader-tags" id="readerTags" hidden>
    <span class="reader-tags-label">Метки:</span>
  </div>

  <nav class="reader-nav" id="readerNav"></nav>

  <section class="reader-related" id="readerRelated" hidden>
    <div class="reader-related-title">Похожие статьи</div>
    <div class="reader-related-grid" id="readerRelatedGrid"></div>
  </section>
</main>
<script>
const API_BASES=[location.origin,'https://admin.lib-shiaway.workers.dev'].filter((v,i,a)=>v&&a.indexOf(v)===i); let API_BASE=null; async function api(path){let last;for(const base of API_BASES){try{const r=await fetch(base+path);if(r.ok){API_BASE=base;return r;}last=r;}catch(e){last=e;}}throw last||new Error('API unavailable');}
function sanitize(html){const d=new DOMParser().parseFromString(String(html||''),'text/html');d.querySelectorAll('script,style,iframe,object,embed,form').forEach(x=>x.remove());d.querySelectorAll('*').forEach(x=>{if(/^o:/i.test(x.tagName))x.remove()});d.querySelectorAll('*').forEach(x=>[...x.attributes].forEach(a=>{const n=a.name.toLowerCase();if(n.startsWith('on')){x.removeAttribute(a.name);return}if(n==='style'){const cleaned=a.value.replace(/(?:^|;)\s*(position|top|left|right|bottom|z-index|mso-[a-z-]*|behavior|zoom)\s*:[^;]*/gi,'').replace(/^;+|;+$/g,'').trim();if(cleaned)x.setAttribute('style',cleaned);else x.removeAttribute('style');return}if(n==='class'&&/mso/i.test(a.value)){x.removeAttribute('class');return}if(n==='lang'||n==='xml:lang')x.removeAttribute(a.name)}));return d.body.innerHTML}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
const id=new URLSearchParams(location.search).get('id');
const THEME_KEY='shiaway_reader_theme';
function setReaderTheme(theme){document.body.classList.toggle('reader-dark',theme==='dark');document.body.classList.toggle('reader-light',theme==='light');localStorage.setItem(THEME_KEY,theme);const b=document.getElementById('readerThemeToggle');if(b)b.setAttribute('aria-label',theme==='dark'?'Светлая тема':'Тёмная тема');}
const savedTheme=localStorage.getItem(THEME_KEY);setReaderTheme(savedTheme==='light'?'light':'dark');
document.getElementById('readerThemeToggle')?.addEventListener('click',()=>setReaderTheme(document.body.classList.contains('reader-dark')?'light':'dark'));

document.getElementById('readerSearchTop').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('readerSearchInput').value.trim();location.href='index.html'+(v?'?search='+encodeURIComponent(v):'')+'#articles';});

function fillSidebar(categories,articles){
 const ICO_FILE='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>';
 const children=pid=>categories.filter(c=>(c.parent_id==null?null:Number(c.parent_id))===(pid==null?null:Number(pid))).sort((x,y)=>String(x.name).localeCompare(String(y.name),'ru'));
 const rubricsSelect=document.getElementById('sidebarRubrics');
 if(rubricsSelect){
   function opts(pid,depth){return children(pid).flatMap(c=>[`<option value="${esc(c.name)}">${'—'.repeat(depth)} ${esc(c.name)} (${Number(c.article_count||0)})</option>`,...opts(c.id,depth+1)]);}
   rubricsSelect.innerHTML='<option value="">Выберите рубрику</option>'+opts(null,0).join('');
   rubricsSelect.addEventListener('change',()=>{if(rubricsSelect.value)location.href='index.html?search='+encodeURIComponent(rubricsSelect.value)+'#articles';});
 }
 const recent=[...articles].sort((a,b)=>Number(b.id)-Number(a.id)).slice(0,10);
 const popular=[...articles].sort((a,b)=>Number(a.id)-Number(b.id)).slice(0,10);
 const listHtml=list=>list.map(a=>`<li><span class="mini-ic">${ICO_FILE}</span><a href="article.html?id=${encodeURIComponent(a.id)}">${esc(a.title||'Без названия')}</a></li>`).join('');
 document.getElementById('sidebarRecent').innerHTML=listHtml(recent);
 document.getElementById('sidebarPopular').innerHTML=listHtml(popular);
}

(async()=>{try{if(!id)throw 0;const r=await api('/api/articles/'+encodeURIComponent(id));const a=await r.json();document.title=(a.title||'Статья')+' — ShiaWay';document.getElementById('readerTitle').textContent=a.title||'Без названия';document.getElementById('readerMeta').textContent=(a.category_name||'Статья')+(a.created_at?'  ·  '+new Date(a.created_at).toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric'}):'');
const content=document.getElementById('readerContent');content.innerHTML=sanitize(a.content||'')||'<p>Содержимое статьи пока не добавлено.</p>';
const heads=[...content.querySelectorAll('h2,h3')];const toc=document.getElementById('readerToc');toc.innerHTML=heads.map((h,i)=>{const x='section-'+i;h.id=x;return `<a href="#${x}">${esc(h.textContent)}</a>`}).join('');if(heads.length)document.getElementById('readerTocBlock').hidden=false;
if(a.category_name)document.getElementById('readerCrumbs').innerHTML='<a class="crumb-home" href="index.html#articles" title="Главная">⌂</a><a href="index.html#articles">Статьи</a><span>/</span><span>'+esc(a.category_name)+'</span><span>/</span><b>'+esc(a.title)+'</b>';

if(a.category_name){document.getElementById('readerTags').hidden=false;document.getElementById('readerTags').insertAdjacentHTML('beforeend',`<a href="index.html?search=${encodeURIComponent(a.category_name)}#articles">${esc(a.category_name)}</a>`);}

const shareUrl=location.href;const shareTitle=a.title||'Статья';
document.getElementById('shareTelegram').href='https://t.me/share/url?url='+encodeURIComponent(shareUrl)+'&text='+encodeURIComponent(shareTitle);
document.getElementById('shareWhatsapp').href='https://wa.me/?text='+encodeURIComponent(shareTitle+' '+shareUrl);
document.getElementById('shareVk').href='https://vk.com/share.php?url='+encodeURIComponent(shareUrl)+'&title='+encodeURIComponent(shareTitle);
document.getElementById('shareTw').href='https://twitter.com/intent/tweet?url='+encodeURIComponent(shareUrl)+'&text='+encodeURIComponent(shareTitle);
const nativeShare=document.getElementById('shareNative');
if(nativeShare){
  nativeShare.hidden=typeof navigator.share!=='function';
  nativeShare.addEventListener('click',async()=>{try{await navigator.share({title:shareTitle,text:shareTitle,url:shareUrl})}catch(e){}});
}
document.getElementById('shareCopy').addEventListener('click',async()=>{
  const b=document.getElementById('shareCopy'); const old=b.innerHTML;
  try{
    if(navigator.clipboard?.writeText) await navigator.clipboard.writeText(shareUrl);
    else { const ta=document.createElement('textarea');ta.value=shareUrl;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove(); }
    b.innerHTML='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    setTimeout(()=>b.innerHTML=old,1600);
  }catch(e){}
});
document.getElementById('readerShare').hidden=false;

let all=[];let categories=[];try{const ar=await api('/api/articles');all=await ar.json();}catch(e){} try{const cr=await api('/api/article-categories');const cd=await cr.json();categories=cd.categories||[];}catch(e){}
if(Array.isArray(all)){fillSidebar(categories,all);
const i=all.findIndex(x=>String(x.id)===String(id));const prev=all[i+1],next=all[i-1];document.getElementById('readerNav').innerHTML=(prev?`<a href="article.html?id=${prev.id}"><small>Предыдущая статья</small><strong>← ${esc(prev.title)}</strong></a>`:'<span></span>')+(next?`<a class="next" href="article.html?id=${next.id}"><small>Следующая статья</small><strong>${esc(next.title)} →</strong></a>`:'<span></span>');
const related=all.filter(x=>String(x.id)!==String(id)&&a.category_name&&x.category_name===a.category_name).slice(0,6);
if(related.length){document.getElementById('readerRelatedGrid').innerHTML=related.map(x=>`<a class="reader-related-card" href="article.html?id=${x.id}"><strong>${esc(x.title)}</strong>${x.category_name?`<span>${esc(x.category_name)}</span>`:''}</a>`).join('');document.getElementById('readerRelated').hidden=false;}
}
}catch(e){document.getElementById('readerTitle').textContent='Статья не найдена';document.getElementById('readerContent').innerHTML='<p>Материал не найден или временно недоступен.</p>'}})();
</script>
</body></html>
